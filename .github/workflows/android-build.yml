name: Build Android APK

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            Irish_Whistle/*.gradle
            Irish_Whistle/gradle/wrapper/gradle-wrapper.properties
            Irish_Whistle/app/*.gradle

      - name: Install required Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-33" "build-tools;30.0.3"

      - name: Build debug APK
        working-directory: Irish_Whistle
        run: bash gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: cp Irish_Whistle/app/build/outputs/apk/debug/app-debug.apk TinWhistleTabs-debug.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tin-whistle-tabs-debug-apk
          path: TinWhistleTabs-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Debug build ${{ github.run_number }}
          body: |
            Automated debug APK built from commit `${{ github.sha }}`.
          prerelease: true
          files: TinWhistleTabs-debug.apk
