name: Build Android APK

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            Irish_Whistle/*.gradle
            Irish_Whistle/gradle/wrapper/gradle-wrapper.properties
            Irish_Whistle/app/*.gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-33" "build-tools;30.0.3"

      - name: Build debug APK
        working-directory: Irish_Whistle
        run: bash gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tin-whistle-tabs-debug-apk
          path: Irish_Whistle/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
