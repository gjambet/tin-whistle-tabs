name: Build Android APK

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Synchronize master
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          git fetch origin master
          git checkout -B master origin/master

      - name: Determine build version
        id: version
        shell: bash
        run: |
          BUILD_FILE="Irish_Whistle/app/build.gradle"
          CURRENT_VERSION="$(sed -n 's/^[[:space:]]*versionName "\([^"]*\)"/\1/p' "$BUILD_FILE")"
          CURRENT_CODE="$(sed -n 's/^[[:space:]]*versionCode \([0-9]*\)/\1/p' "$BUILD_FILE")"

          if [[ ! "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported versionName: $CURRENT_VERSION" >&2
            exit 1
          fi

          NEXT_VERSION="$CURRENT_VERSION"
          NEXT_CODE="$CURRENT_CODE"

          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/master" ]]; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
            NEXT_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
            NEXT_CODE="$((CURRENT_CODE + 1))"
            sed -i "s/versionName \"$CURRENT_VERSION\"/versionName \"$NEXT_VERSION\"/" "$BUILD_FILE"
            sed -i "s/versionCode $CURRENT_CODE/versionCode $NEXT_CODE/" "$BUILD_FILE"
          fi

          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$NEXT_CODE" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            Irish_Whistle/*.gradle
            Irish_Whistle/gradle/wrapper/gradle-wrapper.properties
            Irish_Whistle/app/*.gradle

      - name: Install required Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-33" "build-tools;30.0.3"

      - name: Build debug APK
        working-directory: Irish_Whistle
        run: bash gradlew assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          cp Irish_Whistle/app/build/outputs/apk/debug/app-debug.apk             "TinWhistleTabs-${{ steps.version.outputs.version }}-debug.apk"

      - name: Commit version increment
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Irish_Whistle/app/build.gradle
          git commit -m "build: bump version to ${{ steps.version.outputs.version }} [skip ci]"
          git push origin master

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tin-whistle-tabs-${{ steps.version.outputs.version }}-debug-apk
          path: TinWhistleTabs-${{ steps.version.outputs.version }}-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          target_commitish: master
          body: |
            Automated debug APK for version `${{ steps.version.outputs.version }}`.
          prerelease: true
          files: TinWhistleTabs-${{ steps.version.outputs.version }}-debug.apk
